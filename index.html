<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이브 레벨 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 참여자는 한 화면에 질문 하나(채팅 말풍선), 교사 화면은 실시간 그래프 카드 */
:root{
  --bg:#eef1fb;
  --card:#ffffff;
  --ink:#1c2140;
  --muted:#5b6283;
  --line:#d6dcf0;
  --accent:#ff5d73;
  --accent-soft:#ffe3e7;
  --mint:#1fb89a;
  --sun:#ffc93c;
  --d0:#c9d1ec; --d1:#8fd8c8; --d2:#35b99c; --d3:#0d7f6a;
  --font-display:'Jua','Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-text-size-adjust:100%}
body{min-height:100%}
#app{max-width:520px;margin:0 auto;padding:20px 16px 48px}
#app.wide{max-width:960px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand b{color:var(--ink);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:8px}
.dot.live{background:var(--mint);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.demo{margin:0 0 16px;padding:10px 14px;border:2px dashed var(--ink);border-radius:12px;background:#fff7d6;font-size:13px}
.demo button{margin-left:8px}

.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.hop,.dot.live{animation:none!important}}

/* 시작 화면 */
.intro{background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:28px 22px 24px;box-shadow:6px 6px 0 var(--ink)}
.intro .kicker{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin:0 0 10px}
.intro h1{font-size:38px;line-height:1.18;margin-bottom:12px}
.intro p.lead{margin:0 0 18px;color:var(--muted);font-size:15px}
.lineup{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;margin:6px 0 22px;padding:14px 8px 10px;background:var(--bg);border-radius:16px}
.lineup div{flex:1;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.lineup svg{width:100%;max-width:62px;height:auto;display:block;margin:0 auto 2px}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.btn{display:block;width:100%;padding:15px 18px;border:2px solid var(--ink);border-radius:14px;background:var(--accent);color:#fff;font-family:var(--font-display);font-size:20px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.meta{display:flex;gap:14px;justify-content:center;margin-top:16px;font-size:12px;color:var(--muted)}
.meta span::before{content:"· ";color:var(--accent)}

/* 질문 화면 */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.bar{flex:1;height:10px;border-radius:99px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s ease}
.count{font-family:var(--font-mono);font-size:13px;min-width:48px;text-align:right}
.ask{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:4px 20px 20px 20px;padding:16px 18px;font-family:var(--font-display);font-size:22px;line-height:1.42;box-shadow:4px 4px 0 var(--ink)}
.tag{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin:0 0 0 24px}
.opt{width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:18px 4px 18px 18px;background:#fff;font-size:15px;line-height:1.5;transition:border-color .12s,background .12s,transform .12s}
.opt:hover{border-color:var(--ink);transform:translateX(-2px)}
.opt.sel{border-color:var(--ink);background:var(--accent-soft)}
.backrow{margin-top:22px}
.link{background:none;border:0;padding:6px 2px;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* 결과 화면 */
.result{background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:26px 20px 24px;box-shadow:6px 6px 0 var(--ink)}
.stage{display:grid;place-items:center;border-radius:20px;padding:18px 0 8px;margin-bottom:16px}
.stage svg{width:190px;height:auto}
.hop{animation:hop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hop{from{transform:translateY(24px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.lv{display:inline-block;font-family:var(--font-mono);font-size:12px;padding:3px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--sun)}
.result h2{font-size:36px;line-height:1.15;margin:10px 0 4px}
.tagline{margin:0 0 16px;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:6px;margin-bottom:14px;font-family:var(--font-mono)}
.score b{font-size:34px;font-weight:500}
.score small{color:var(--muted);font-size:14px}
.stats{display:grid;gap:10px;margin-bottom:20px}
.stat{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.stat .track{height:12px;border-radius:99px;background:var(--bg);border:2px solid var(--ink);overflow:hidden}
.stat .track i{display:block;height:100%;background:var(--mint)}
.stat.top .track i{background:var(--accent)}
.stat em{font-family:var(--font-mono);font-style:normal;text-align:right;color:var(--muted)}
.stat .best{display:inline-block;margin-left:4px;font-size:10px;color:var(--accent);font-weight:700}
.desc{margin:0 0 14px}
.traits{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:6px}
.traits li{padding-left:22px;position:relative;font-size:14px}
.traits li::before{content:"";position:absolute;left:2px;top:.62em;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.tip{background:var(--bg);border-left:6px solid var(--mint);border-radius:6px 14px 14px 6px;padding:14px 16px;margin-bottom:20px;font-size:14px}
.tip b{display:block;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted);margin-bottom:4px}
.sent{display:flex;gap:8px;align-items:center;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#e3f8f2;border:2px solid var(--mint);font-size:14px}
.sent.err{background:var(--accent-soft);border-color:var(--accent)}
.share label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.share textarea{width:100%;height:78px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:13px;color:var(--ink);background:#fff;resize:none}
.share .btn{margin-top:10px;font-size:18px;background:#fff;color:var(--ink)}
.note{min-height:20px;margin:8px 0 0;font-size:13px;color:var(--mint);text-align:center}
.result .again{margin-top:6px;text-align:center}
.toteacher{margin-top:10px;text-align:center}
.toteacher .link{display:inline-block;font-size:13px}

/* 교사 화면 */
.t-head{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;margin-bottom:16px}
.t-count{flex:none;min-width:200px;background:var(--ink);color:#fff;border-radius:20px;padding:18px 24px;box-shadow:5px 5px 0 var(--accent)}
.t-count small{display:flex;align-items:center;font-family:var(--font-mono);font-size:12px;opacity:.8}
.t-count small .dot{background:var(--mint)}
.t-count b{display:block;font-family:var(--font-display);font-weight:400;font-size:72px;line-height:1.05}
.t-count span{font-size:14px;opacity:.85}
.t-links{flex:1;min-width:260px;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:14px 18px;font-size:13px}
.t-links b{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted);display:block;margin-top:6px}
.t-links code{display:block;word-break:break-all;font-family:var(--font-mono);font-size:12px;background:var(--bg);padding:6px 8px;border-radius:8px;margin-top:2px}
.insight{background:#fff7d6;border:2px solid var(--ink);border-radius:20px;padding:16px 20px;margin-bottom:16px}
.insight h3{font-size:20px;margin-bottom:6px}
.insight ul{margin:0;padding-left:18px;font-size:15px}
.insight li{margin:2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}.t-count b{font-size:56px}}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px 20px;min-width:0}
.panel h3{font-size:22px;margin-bottom:2px}
.panel .sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.lvchart{display:flex;gap:8px;align-items:flex-end}
.lvcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.lvcol .num{font-family:var(--font-mono);font-size:14px;margin-bottom:4px}
.lvcol .well{width:100%;height:150px;display:flex;align-items:flex-end}
.lvcol .well i{display:block;width:100%;border:2px solid var(--ink);border-radius:10px 10px 0 0;transition:height .5s ease}
.lvcol svg{width:100%;max-width:64px;height:auto;margin-top:4px}
.lvcol .nm{font-size:11px;text-align:center;line-height:1.3;color:var(--muted)}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:104px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.hb .track{height:18px;border-radius:99px;background:var(--bg);border:2px solid var(--ink);overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--mint);transition:width .5s ease}
.hb em{font-family:var(--font-mono);font-style:normal;font-size:13px;text-align:right}
.q1{display:grid;gap:10px}
.q1 .hb{grid-template-columns:minmax(0,1fr) 120px 44px}
.q1 .lab{font-size:14px;line-height:1.35}
.q1 .hb:nth-child(1) i{background:var(--d0)}
.q1 .hb:nth-child(2) i{background:var(--d2)}
.q1 .hb:nth-child(3) i{background:var(--d3)}
.qlist details{border-top:2px solid var(--line);padding:8px 0}
.qlist details:first-child{border-top:0}
.qlist summary{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;cursor:pointer;font-size:14px;list-style:none}
.qlist summary::-webkit-details-marker{display:none}
.qlist summary::before{display:none}
.stack{display:flex;height:18px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--bg)}
.stack i{display:block;height:100%;transition:width .5s ease}
.s0{background:var(--d0)}.s1{background:var(--d2)}.s2{background:var(--d3)}
.qlist summary em{font-family:var(--font-mono);font-style:normal;font-size:12px;text-align:right;color:var(--muted)}
.qdetail{display:grid;gap:6px;padding:10px 4px 4px 12px}
.qd{display:grid;grid-template-columns:14px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:13px}
.qd span.sw{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink)}
.qd em{font-family:var(--font-mono);font-style:normal;text-align:right;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);display:inline-block}
.feed{display:grid;gap:8px;max-height:420px;overflow-y:auto}
.fi{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:6px 8px;border-radius:12px;background:var(--bg)}
.fi svg{width:44px;height:auto}
.fi b{display:block;font-size:14px}
.fi small{color:var(--muted);font-size:12px}
.fi span{font-family:var(--font-mono);font-size:13px}
.empty{padding:34px 12px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px}
@media (max-width:520px){.qlist summary{grid-template-columns:1fr 54px}.qlist summary .stack{grid-column:1/-1;order:3}.hb{grid-template-columns:84px 1fr 48px}.q1 .hb{grid-template-columns:minmax(0,1fr) 70px 40px}}
</style>
</head>

<div id="app"></div>

<script>
/* ============ 설정 (예비용: 일반 호스팅 + 구글 시트 저장) ============
   이 파일은 Netlify, GitHub Pages 같은 일반 웹 호스팅에 올리고,
   응답 저장은 구글 앱스크립트(웹 앱)가 구글 시트에 합니다.
   ▼ 아래 따옴표 안에 앱스크립트 웹 앱 주소(…/exec)를 붙여 넣으세요.
   비워 두면 데모 모드(이 기기에서만 저장)로 동작합니다. */
var API_URL = "https://script.google.com/macros/s/AKfycbyftril02WbhQNlWtb_2BL_VtI_E6w_lJY9HhHl0u1SfnjRAVgJba1X_CHkA2gVk-Fv/exec";

var POLL_MS = 4000; // 교사 화면이 새 응답을 확인하는 간격(밀리초)

/* 주소창의 매개변수(?teacher, ?r=회차)를 읽는다 */
function param(name){
  var m=new RegExp("[?&]"+name+"(?:=([^&#]*))?(?:[&#]|$)").exec(location.search);
  if(!m) return null;
  try{ return m[1]?decodeURIComponent(m[1]):""; }catch(e){ return ""; }
}

/* 영역: 0 개념 이해 · 1 도구 경험 · 2 프롬프트 감각 · 3 수업 적용 (영역마다 3문항)
   보기는 3개이고 점수 0~2 순서로 적는다. 0: 아직 모름·안 해 봄 / 1: 알고 있거나 조금 해 봄 / 2: 직접 할 수 있음
   보기는 화면에도 이 순서(쉬운 단계 → 어려운 단계) 그대로 보여 준다. */
var CATS = ["개념 이해","도구 경험","프롬프트 감각","수업 적용"];
var Q = [
 {c:0,s:"바이브코딩 설명",q:"‘바이브코딩’이 무엇인지 설명할 수 있나요?",
  o:["처음 들어 보거나 이름만 들어 봤어요.","대략 어떤 것인지 설명할 수 있어요.","예를 들어 가며 다른 선생님께 설명할 수 있어요."]},
 {c:0,s:"코드 살펴보기",q:"AI가 만들어 준 코드를 열어 보면 나는?",
  o:["어디가 무엇인지 전혀 모르겠어요.","글자나 색처럼 간단한 부분은 어디인지 찾을 수 있어요.","화면, 기능, 저장을 맡는 부분이 어디인지 대략 구분할 수 있어요."]},
 {c:0,s:"AI 에이전트",q:"‘AI 에이전트’에 대해 알고 있는 것은?",
  o:["처음 들어 보거나 챗봇과 같은 것이라고 생각해요.","AI가 여러 단계의 일을 스스로 처리하는 것이라고 알고 있어요.","파일 정리나 웹사이트 작업 같은 일을 에이전트에게 실제로 맡겨 봤어요."]},
 {c:1,s:"AI 사용 경험",q:"지금까지 AI를 써 본 경험에 가장 가까운 것은?",
  o:["AI 채팅(챗GPT, 제미나이 등)을 거의 써 보지 않았어요.","AI 채팅으로 간단한 글이나 이미지 등 수업 자료를 만들어 봤어요.","AI로 앱이나 웹페이지를 만들어 봤어요. (캔바 AI, 제미나이 캔버스, 러버블 등)"]},
 {c:1,s:"링크로 공유·배포",q:"내가 만든 웹앱을 링크로 다른 사람에게 공유(배포)해 본 적이 있나요?",
  o:["‘배포’가 무슨 뜻인지 잘 모르겠어요.","뜻은 알지만 직접 해 본 적은 없어요.","직접 만든 웹앱을 링크로 공유해 봤어요."]},
 {c:1,s:"데이터 저장",q:"응답이 저장되고 쌓이는 앱(설문, 퀴즈 기록 등)을 만든다면?",
  o:["어떻게 저장하는지 모르겠어요.","구글 시트나 데이터베이스에 연결해야 한다는 것은 알아요.","구글 시트(앱스크립트)나 데이터베이스에 직접 연결해 봤어요."]},
 {c:2,s:"밋밋한 결과 대응",q:"AI에게 ‘퀴즈 앱 만들어 줘’라고 했더니 결과가 밋밋해요. 다음 행동은?",
  o:["AI로는 이 정도가 한계라고 보고 그대로 쓰거나 그만둬요.","같은 요청을 다시 하거나 ‘더 예쁘게’처럼 짧게 덧붙여요.","학년, 과목, 필요한 기능, 디자인을 구체적으로 적어 다시 요청해요."]},
 {c:2,s:"기능이 많은 앱 요청",q:"기능이 많은 앱을 만들고 싶을 때 나는?",
  o:["어떻게 요청해야 할지 막막해요.","원하는 기능을 한 번에 모두 적어서 요청해요.","핵심 기능부터 만들고, 확인하면서 하나씩 추가해 달라고 해요."]},
 {c:2,s:"오류 대응",q:"만들어 둔 앱이 제대로 작동하지 않아요. 나는?",

/* 24점 만점 기준 레벨 구간: 0–5 / 6–10 / 11–15 / 16–20 / 21–24 */
function levelOf(s){ return s<=5?1 : s<=10?2 : s<=15?3 : s<=20?4 : 5; }

/* 응답 한 건을 만든다. a: 문항별 점수(12), c: 영역별 합(4) */
function makeRecord(name, ans){
  var c=[0,0,0,0], t=0, i;
  for(i=0;i<Q.length;i++){ c[Q[i].c]+=ans[i]; t+=ans[i]; }
  return {n:name||"", t:Date.now(), s:t, l:levelOf(t), c:c, a:ans.slice()};
}

/* ============ 저장소: 구글 앱스크립트 또는 데모 모드 ============ */
var room = (function(){
  var r=param("r")||"main";
  r=r.replace(/[^A-Za-z0-9가-힣_-]/g,"").slice(0,20);
  return r||"main";
})();

function validRecord(r){
  if(!r||typeof r!=="object") return false;
  if(!Array.isArray(r.a)||r.a.length!==Q.length||!Array.isArray(r.c)||r.c.length!==4) return false;
  if(!(r.l>=1&&r.l<=5)||typeof r.s!=="number") return false;
  for(var i=0;i<r.a.length;i++){ if(!(r.a[i]>=0&&r.a[i]<=MAX_PT)) return false; }
  for(var k=0;k<4;k++){ if(typeof r.c[k]!=="number") return false; }
  return true;
}

function makeLocalStore(){
  var key="vibeTest:"+room, mem=[], listeners=[];
  function read(){
    try{ var v=localStorage.getItem(key); if(v) return JSON.parse(v); }catch(e){}
    return mem;
  }
  function write(arr){
    mem=arr;
    try{ localStorage.setItem(key,JSON.stringify(arr)); }catch(e){}
  }
  function emit(){ var d=read(); listeners.forEach(function(f){f(d);}); }
  window.addEventListener("storage",function(e){ if(e.key===key) emit(); });
  return {
    mode:"local",
    save:function(rec){ var d=read().slice(); d.push(rec); write(d); emit(); return Promise.resolve(); },
    subscribe:function(cb){ listeners.push(cb); cb(read()); },
    fill:function(n){
      var d=read().slice();
      for(var k=0;k<n;k++){
        var base=Math.random()*1.6, ans=Q.map(function(){
          var v=Math.round(base+(Math.random()-0.5)*1.6); return Math.max(0,Math.min(MAX_PT,v));
        });
        d.push(makeRecord(["김","이","박","최","정","한","오","서"][k%8]+"선생님",ans));
      }
      write(d); emit();
    },
    clear:function(){ write([]); emit(); }
  };
}

/* 앱스크립트 웹 앱에 요청한다.
   - 쿠키를 보내지 않으므로(credentials:"omit") 구글 계정이 여러 개 로그인돼 있어도 문제없다.
   - text/plain으로 보내면 브라우저의 사전 확인(CORS preflight) 없이 앱스크립트에 바로 닿는다. */
function callServer(fn,room,rec){
  var req = fn==="saveResponse"
    ? fetch(API_URL,{method:"POST",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({action:"save",room:room,rec:rec})})
    : fetch(API_URL+(API_URL.indexOf("?")<0?"?":"&")+"action=list&r="+encodeURIComponent(room)+"&_="+Date.now(),
        {credentials:"omit",cache:"no-store"});
  return req.then(function(res){
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.json();
  }).then(function(j){
    if(!j||!j.ok) throw new Error((j&&j.error)||"서버 오류");
    return j.data;
  });
}

function makeGasStore(){
  return {
    mode:"server",
    save:function(rec){ return callServer("saveResponse",room,rec); },
    /* 실시간 연결 대신 POLL_MS마다 새 응답을 확인하고, 바뀐 것이 있을 때만 화면을 다시 그린다 */
    subscribe:function(cb,onErr){
      var sig=null, gotOnce=false;
      function tick(){
        if(document.hidden){ setTimeout(tick,POLL_MS); return; }
        callServer("listResponses",room).then(function(arr){
          arr=Array.isArray(arr)?arr:[];
          var last=0; arr.forEach(function(r){ if(r&&r.t>last) last=r.t; });
          var s=arr.length+":"+last;
          if(s!==sig){ sig=s; cb(arr); }
          gotOnce=true;
        },function(err){
          if(!gotOnce && onErr) onErr(err);
        }).then(function(){ setTimeout(tick,POLL_MS); });
      }
      tick();
    }
  };
}

var storePromise = null;
function getStore(){
  if(storePromise) return storePromise;
  var s;
  if(/googleusercontent\.com\/macros\/echo/.test(API_URL)){
    /* 브라우저 주소창에 남은 임시 결과 주소를 넣은 경우: 저장할 수 없으니 데모 모드로 두고 안내한다 */
    s=makeLocalStore(); s.badUrl=true;
  }else{
    s=/^https?:\/\//.test(API_URL) ? makeGasStore() : makeLocalStore();
  }
  storePromise = Promise.resolve(s);
  return storePromise;
}

  app.className="";
  var rec=makeRecord(state.name,state.ans);
  var cat=rec.c, total=rec.s, lv=rec.l, L=LEVELS[lv-1];
  var best=0; for(var c=1;c<4;c++){ if(cat[c]>cat[best]) best=c; }
  var stats=CATS.map(function(name,c){
    return '<div class="stat'+(c===best?' top':'')+'"><span>'+name+(c===best?'<span class="best">BEST</span>':'')+'</span><div class="track"><i style="width:'+(cat[c]/CAT_MAX*100)+'%"></i></div><em>'+cat[c]+'/'+CAT_MAX+'</em></div>';
  }).join("");
  var traits=L.traits.map(function(t){return '<li>'+t+'</li>';}).join("");
  var share="[바이브 레벨 테스트] "+(state.name?state.name+" · ":"")+"Lv."+lv+" "+L.n+" ("+total+"/"+TOTAL_MAX+") · 개념 "+cat[0]+"/"+CAT_MAX+" · 도구 "+cat[1]+"/"+CAT_MAX+" · 프롬프트 "+cat[2]+"/"+CAT_MAX+" · 수업 "+cat[3]+"/"+CAT_MAX;
  app.innerHTML = brand('result')+
   '<div id="banner"></div>'+
   '<section class="result fade">'+
    '<div class="stage hop" style="background:'+L.color+'55">'+charSVG(lv)+'</div>'+
    '<span class="lv">Lv.'+lv+' / 5</span>'+
    '<h2>'+L.n+'</h2>'+
    '<p class="tagline" id="who"></p>'+
    '<div class="score"><b>'+total+'</b><small>/ '+TOTAL_MAX+'점</small></div>'+
    '<div class="stats">'+stats+'</div>'+
    '<p class="desc">'+L.desc+'</p>'+
    '<ul class="traits">'+traits+'</ul>'+
    '<div class="tip"><b>// 이번 연수 활용 팁</b>'+L.tip+'</div>'+
    '<div class="sent" id="sent" aria-live="polite">응답을 보내는 중이에요...</div>'+
    '<div class="share"><label for="sharetext">내 결과 (직접 전달할 때 복사해 주세요)</label>'+
     '<textarea id="sharetext" readonly></textarea>'+
     '<button class="btn" type="button" id="copy">결과 복사하기</button>'+
     '<p class="note" id="note" aria-live="polite"></p></div>'+
    '<div class="again"><button type="button" class="link" id="again">다시 해 보기</button></div>'+
   '</section>';
  document.getElementById("who").textContent = (state.name?state.name+" 선생님, ":"")+L.tag;
  var ta=document.getElementById("sharetext"); ta.value=share;
  document.getElementById("copy").onclick=function(){
    var note=document.getElementById("note");
    function fallback(){
      ta.focus(); ta.select();
      var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
      note.textContent = ok ? "복사했어요." : "위 글을 길게 눌러 직접 복사해 주세요.";
    }
    try{
      navigator.clipboard.writeText(share).then(function(){note.textContent="복사했어요.";},fallback);
    }catch(e){ fallback(); }
  };
  document.getElementById("again").onclick=function(){renderIntro();window.scrollTo(0,0);};

  var sent=document.getElementById("sent");
  getStore().then(function(store){
    var slot=document.getElementById("banner");
    if(slot){ slot.innerHTML=demoBanner(store,true); bindSwitch(); }
    if(state.saved){ sent.textContent="이미 보낸 응답이 있어서 이번 결과는 보내지 않았어요."; return; }
    state.saved=true;
    store.save(rec).then(function(){
      sent.textContent = store.mode==="server" ? "응답이 강사 화면에 반영됐어요." : "응답을 이 기기에 저장했어요. (데모 모드)";
    },function(){
      sent.className="sent err";
      sent.textContent="응답을 보내지 못했어요. 아래 결과를 복사해서 직접 전달해 주세요.";
      state.saved=false;
    });
  });
}

/* ============ 교사 화면 ============ */
var teacherSubscribed = false;
var openSet = {};
var teacherData = [];

function analyze(recs){
  var n=recs.length, lv=[0,0,0,0,0], cs=[0,0,0,0], tot=0;
  var dist=Q.map(function(q){return q.o.map(function(){return 0;});});
  recs.forEach(function(r){
    lv[r.l-1]++; tot+=r.s;
    r.c.forEach(function(v,i){cs[i]+=v;});
    r.a.forEach(function(v,i){dist[i][v]++;});
  });
  return {n:n,lv:lv,cs:cs,tot:tot,dist:dist};
}

function insightsHTML(A){
  if(!A.n) return '';
  var items=[];
  items.push('전체 평균 <b>'+(A.tot/A.n).toFixed(1)+'점</b> / '+TOTAL_MAX+'점');
  var avgs=A.cs.map(function(v){return v/A.n;}), hi=0, lo=0;
  for(var i=1;i<4;i++){ if(avgs[i]>avgs[hi]) hi=i; if(avgs[i]<avgs[lo]) lo=i; }
  items.push('가장 높은 영역은 <b>'+CATS[hi]+'</b>('+avgs[hi].toFixed(1)+'/'+CAT_MAX+'), 가장 낮은 영역은 <b>'+CATS[lo]+'</b>('+avgs[lo].toFixed(1)+'/'+CAT_MAX+')');
  var q1=A.dist[0][1]+A.dist[0][2];
  items.push('바이브코딩을 대략이라도 설명할 수 있는 분은 <b>'+q1+'명</b>('+Math.round(q1/A.n*100)+'%)');
  var qm=Q.map(function(q,i){
    var s=A.dist[i].reduce(function(acc,v,k){return acc+v*k;},0);
    return {i:i,m:s/A.n};
  }).sort(function(a,b){return a.m-b.m;}).slice(0,3);
  items.push('평균이 낮은 문항: '+qm.map(function(x){return '<b>'+esc(Q[x.i].s)+'</b>('+x.m.toFixed(1)+')';}).join(', '));
  return '<section class="insight"><h3>한눈에 보기</h3><ul>'+items.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></section>';
}

function levelChartHTML(A){
  var max=Math.max.apply(null,A.lv.concat([1]));
  return '<div class="lvchart">'+LEVELS.map(function(L,i){
    var h=A.lv[i]?Math.max(4,A.lv[i]/max*100):0;
    return '<div class="lvcol"><span class="num">'+A.lv[i]+'명</span><div class="well"><i style="height:'+h+'%;background:'+L.color+'"></i></div>'+charSVG(i+1)+'<span class="nm">Lv.'+(i+1)+'<br>'+L.n+'</span></div>';
  }).join('')+'</div>';
}

function catChartHTML(A){
  return '<div class="hbars">'+CATS.map(function(name,i){
    var avg=A.n?A.cs[i]/A.n:0;
    return '<div class="hb"><span>'+name+'</span><div class="track"><i style="width:'+(avg/CAT_MAX*100)+'%"></i></div><em>'+avg.toFixed(1)+'/'+CAT_MAX+'</em></div>';
  }).join('')+'</div>';
}

function q1HTML(A){
  var d=A.dist[0], max=Math.max.apply(null,d.concat([1]));
  return '<div class="q1">'+Q[0].o.map(function(t,k){
    return '<div class="hb"><span class="lab">'+esc(t)+'</span><div class="track"><i style="width:'+(d[k]/max*100)+'%"></i></div><em>'+d[k]+'명</em></div>';
  }).join('')+'</div>';
}

function qListHTML(A){
  var legend='<div class="legend"><span><i class="s0"></i>낮음</span><span><i class="s1"></i>중간</span><span><i class="s2"></i>높음</span></div>';
  var rows=Q.map(function(q,i){
    var d=A.dist[i], hi=d[MAX_PT];
    var stack=A.n?'<div class="stack">'+d.map(function(v,k){return v?'<i class="s'+k+'" style="width:'+(v/A.n*100)+'%"></i>':'';}).join('')+'</div>':'<div class="stack"></div>';
    var det=q.o.map(function(t,k){
      return '<div class="qd"><span class="sw s'+k+'"></span><span>'+esc(t)+'</span><em>'+d[k]+'명 '+(A.n?Math.round(d[k]/A.n*100):0)+'%</em></div>';
    }).join('');
    return '<details data-q="'+i+'"'+(openSet[i]?' open':'')+'><summary><span>'+(i+1)+'. '+esc(q.s)+'</span>'+stack+'<em>'+(A.n?Math.round(hi/A.n*100):0)+'%</em></summary><div class="qdetail">'+det+'</div></details>';
  }).join('');
  return legend+'<div class="qlist">'+rows+'</div>';
}

function feedHTML(recs){
  if(!recs.length) return '<div class="empty">아직 응답이 없어요.</div>';
  var list=recs.slice().sort(function(a,b){return (b.t||0)-(a.t||0);}).slice(0,30);
  return '<div class="feed">'+list.map(function(r){
    var L=LEVELS[r.l-1];
    return '<div class="fi">'+charSVG(r.l)+'<div><b>'+esc(r.n?String(r.n).slice(0,12):"익명")+'</b><small>'+L.n+'</small></div><span>'+r.s+'점</span></div>';
  }).join('')+'</div>';
}

function pageUrls(){
  var base=location.href.split(/[?#]/)[0], rq=room!=="main"?("r="+encodeURIComponent(room)):"";
  return {stu:base+(rq?"?"+rq:""), tea:base+"?teacher"+(rq?"&"+rq:"")};
}
function urlsHTML(){
  var u=pageUrls(), stu=u.stu, tea=u.tea;
  return '<b>참여자 주소 (QR로 만들어 화면에 띄우세요)</b><code>'+esc(stu)+'</code><b>교사 화면 주소 (회차: '+esc(room)+')</b><code>'+esc(tea)+'</code>';
}

function paintTeacher(store){
  var A=analyze(teacherData);
  var body=document.getElementById("tbody");
  if(!body) return;
  var empty=!A.n;
  body.innerHTML =
   '<div class="t-head">'+
     '<div class="t-count"><small><i class="dot live"></i>실시간</small><b>'+A.n+'</b><span>명 참여</span></div>'+
     '<div class="t-links">'+urlsHTML()+'</div>'+
   '</div>'+
   (empty?'<div class="empty" style="background:#fff;margin-bottom:16px">아직 응답이 없어요. 참여자가 테스트를 마치면 이 화면에 바로 나타납니다.</div>':insightsHTML(A))+
   '<div class="grid">'+
     '<section class="panel"><h3>레벨 분포</h3><p class="sub">캐릭터별 인원</p>'+levelChartHTML(A)+'</section>'+
     '<section class="panel"><h3>영역별 평균</h3><p class="sub">각 영역 '+CAT_MAX+'점 만점</p>'+catChartHTML(A)+'</section>'+
   '</div>'+
   '<div class="grid">'+
     '<section class="panel"><h3>바이브코딩을 설명할 수 있나요?</h3><p class="sub">1번 질문 응답</p>'+q1HTML(A)+'</section>'+
     '<section class="panel"><h3>최근 응답</h3><p class="sub">가장 최근 30명</p>'+feedHTML(teacherData)+'</section>'+
   '</div>'+
   '<section class="panel" style="margin-bottom:16px"><h3>문항별 응답 분포</h3><p class="sub">줄을 누르면 보기별 인원이 나와요. 오른쪽 숫자는 가장 높은 단계를 고른 비율이에요.</p>'+qListHTML(A)+'</section>';
  var ds=body.querySelectorAll("details");
  for(var k=0;k<ds.length;k++){
    ds[k].addEventListener("toggle",(function(d){return function(){ openSet[d.getAttribute("data-q")]=d.open; };})(ds[k]));
  }
  var tools=document.getElementById("ttools");
  if(tools && store.mode==="local" && !tools.innerHTML){
    tools.innerHTML='<button type="button" class="link" id="fill">샘플 응답 20명 채우기</button> <button type="button" class="link" id="clr">응답 비우기</button>';
    document.getElementById("fill").onclick=function(){store.fill(20);};
    document.getElementById("clr").onclick=function(){store.clear();};
  }
}

function renderTeacher(){
  app.className="wide";
  app.innerHTML = brand('교사 화면 · 회차 '+esc(room))+
    '<div id="banner"></div><div id="ttools" style="margin-bottom:10px"></div>'+
    '<h1 style="font-size:34px;margin-bottom:14px">바이브 레벨 테스트 현황</h1>'+
    '<div id="tbody" class="fade"><div class="empty">연결하는 중이에요...</div></div>';
  getStore().then(function(store){
    var slot=document.getElementById("banner");
    if(slot){ slot.innerHTML=demoBanner(store,true); bindSwitch(); }
    if(teacherSubscribed){ paintTeacher(store); return; }
    teacherSubscribed=true;
    var timer=setTimeout(function(){
      var b=document.getElementById("tbody");
      if(b && !teacherData.length && !b.querySelector(".t-count")) b.innerHTML='<div class="empty">데이터를 불러오지 못했어요. API_URL 주소와 앱스크립트 배포 설정을 확인해 주세요.</div>';
    },10000);
    store.subscribe(function(arr){
      clearTimeout(timer);
      teacherData=arr.filter(validRecord);
      if(isTeacher()) paintTeacher(store);
    },function(){
      var b=document.getElementById("tbody");
      if(b) b.innerHTML='<div class="empty">응답을 불러오지 못했어요. 웹 앱 배포의 액세스 권한이 \'모든 사용자\'인지, 시트 권한을 승인했는지 확인해 주세요.</div>';
    });
  });
}

/* ============ 시작 ============ */
function route(){
  window.scrollTo(0,0);
  if(isTeacher()){ renderTeacher(); }
  else { renderIntro(); }
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
